name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: |
          unzip -q "Iptv-player534.zip" -d .
          ls -la
          find . -maxdepth 3 -name "settings.gradle*"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -1)
          echo "Found: $SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pro_IPTV-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
